version: "3.8"

services:
  neo4j:
    image: docker.io/library/neo4j:5-community
    container_name: nexus-test-neo4j
    environment:
      NEO4J_AUTH: "neo4j/password"
      NEO4J_server_bolt_listen__address: "0.0.0.0:7687"
      NEO4J_server_http_listen__address: "0.0.0.0:7474"
    ports:
      - "7687:7687"
      - "7474:7474"
    volumes:
      - neo4j_test_data:/data
      - neo4j_test_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  redis:
    image: docker.io/library/redis:7-alpine
    container_name: nexus-test-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_test_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  neo4j_test_data:
  neo4j_test_logs:
  redis_test_data:
