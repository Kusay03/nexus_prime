version: "3.8"

# Run before first `podman-compose up`:
#   podman pod create --name nexus-core --network host
# Then:
#   podman-compose up -d

services:
  neo4j:
    image: docker.io/library/neo4j:5-community
    container_name: nexus-neo4j
    network_mode: host
    environment:
      NEO4J_AUTH: "${NEO4J_USER}/${NEO4J_PASSWORD}"
      NEO4J_server_bolt_listen__address: "0.0.0.0:7687"
      NEO4J_server_http_listen__address: "0.0.0.0:7474"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  redis:
    image: docker.io/library/redis:7-alpine
    container_name: nexus-redis
    network_mode: host
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: api/Containerfile
      network: host
    container_name: nexus-api
    network_mode: host
    env_file: .env
    depends_on:
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  neo4j_data:
  neo4j_logs:
  redis_data:
